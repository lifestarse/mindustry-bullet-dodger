name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Mindustry & Arc jars
        run: |
          mkdir -p java/libs
          curl -fL --retry 4 --retry-delay 5 -o java/libs/mindustry-core.jar \
            'https://jitpack.io/com/github/Anuken/Mindustry/core/v146/core-v146.jar'
          curl -fL --retry 4 --retry-delay 5 -o java/libs/arc-core.jar \
            'https://jitpack.io/com/github/Anuken/Arc/arc-core/v154/arc-core-v154.jar'

      - name: Compile Java mod
        working-directory: java
        run: |
          mkdir -p build/classes dist
          javac -encoding UTF-8 \
            -cp "libs/mindustry-core.jar:libs/arc-core.jar" \
            -d build/classes \
            src/main/java/dodger/*.java
          cp mod.hjson build/classes/
          jar cf dist/Dodger.jar -C build/classes .

      - name: Validate JS mod structure
        run: |
          test -f mod.hjson || (echo "root mod.hjson missing" && exit 1)
          test -f scripts/main.js || (echo "scripts/main.js missing" && exit 1)
          node --check scripts/main.js
          
