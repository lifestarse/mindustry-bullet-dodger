name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0). Required for manual run.'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platform-tools'

      - name: Fetch Mindustry & Arc jars
        run: |
          mkdir -p java/libs
          curl -fL --retry 4 --retry-delay 5 -o java/libs/mindustry-core.jar \
            'https://jitpack.io/com/github/Anuken/Mindustry/core/v146/core-v146.jar'
          curl -fL --retry 4 --retry-delay 5 -o java/libs/arc-core.jar \
            'https://jitpack.io/com/github/Anuken/Arc/arc-core/v154/arc-core-v154.jar'

      - name: Compile Java mod
        working-directory: java
        run: |
          mkdir -p build/classes dist
          javac -encoding UTF-8 \
            -cp "libs/mindustry-core.jar:libs/arc-core.jar" \
            -d build/classes \
            src/main/java/dodger/*.java
          cp mod.hjson build/classes/

      - name: Convert classes to DEX (Android compat)
        working-directory: java
        run: |
          D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          find build/classes -name "*.class" > class_list.txt
          # --min-api 21 — Android 5.0+, покрывает 99% устройств с Mindustry.
          # БЕЗ --no-desugaring — d8 развернёт lambdas, method refs и др. в обычные классы,
          # иначе на API < 26 invoke-dynamic просто не работает и мод вылетает в init().
          $D8 --min-api 21 --output build/classes \
            $(cat class_list.txt) \
            --lib "$ANDROID_HOME/platforms/android-34/android.jar" \
            --classpath libs/mindustry-core.jar \
            --classpath libs/arc-core.jar
          ls -la build/classes/
          rm class_list.txt

      - name: Package Java jar (universal — desktop + Android)
        working-directory: java
        run: jar cf dist/Dodger.jar -C build/classes .

      - name: Verify jar contents
        working-directory: java
        run: |
          echo "=== Contents of Dodger.jar ==="
          unzip -l dist/Dodger.jar
          echo ""
          if unzip -l dist/Dodger.jar | grep -q classes.dex; then
            echo "OK: classes.dex present (Android-compatible)"
          else
            echo "WARN: classes.dex missing — Android won't load this jar"
            exit 1
          fi
          if unzip -l dist/Dodger.jar | grep -q "DodgerMod.class"; then
            echo "OK: DodgerMod.class present (desktop-compatible)"
          else
            echo "WARN: DodgerMod.class missing — desktop won't load this jar"
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dodger-builds
          path: java/dist/Dodger.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          body: |
            ## Установка

            **Dodger.jar** — единственный артефакт, работает и на десктопе, и на Android.

            1. Скачай `Dodger.jar` ниже
            2. Положи в папку модов Mindustry:
               - **Android:** `/storage/emulated/0/Android/data/io.anuke.mindustry/files/mods/`
                 (или через файловый менеджер: Внутр. память → Android → data → io.anuke.mindustry → files → mods)
               - **Steam:** `<Mindustry>/saves/mods/`
               - **Standalone Windows:** `%AppData%/Mindustry/mods/`
               - **Standalone Linux:** `~/.local/share/Mindustry/mods/`
            3. Перезапусти игру, включи в Settings → Mods

            Включение в бою: `Ctrl+Shift+B` (десктоп) или Settings → Dodger.
          files: java/dist/Dodger.jar

